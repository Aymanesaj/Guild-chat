groups:
  - name: transcendence_alerts
    rules:
      - alert: MicroserviceDown
        expr: up{job=~"chat-service|org-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Microservice {{ $labels.job }} is DOWN"
          description: "Microservice target {{ $labels.job }} at {{ $labels.instance }} has been down for > 30 seconds."

      - alert: HighContainerCpuUsage
        expr: (rate(container_cpu_usage_total_nanoseconds[1m]) / rate(container_cpu_system_usage_nanoseconds[1m])) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.container }}"
          description: "Container {{ $labels.container }} CPU usage has exceeded 85% of total host CPU capacity for more than 2 minutes."

      - alert: HighContainerMemoryUsage
        expr: (container_memory_usage_bytes / (container_memory_limit_bytes > 0)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on {{ $labels.container }}"
          description: "Container {{ $labels.container }} memory usage is above 85% of its limit for > 2 minutes."

      - alert: HighHttp5xxErrorRate
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (job) (rate(http_server_requests_seconds_count[5m]))
          ) * 100 > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx Error Rate on {{ $labels.job }}"
          description: "Microservice {{ $labels.job }} is experiencing > 5% HTTP 5xx server errors over 5 minutes."

      - alert: DockerExporterUnhealthy
        expr: |
          up{job="docker-exporter"} == 0
          or docker_exporter_collection_success{job="docker-exporter"} == 0
          or (time() - docker_exporter_last_success_timestamp_seconds{job="docker-exporter"}) > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Docker metrics are unavailable or stale"
          description: "Docker exporter {{ $labels.instance }} has been down, failing collection, or serving stale data for more than 1 minute."
