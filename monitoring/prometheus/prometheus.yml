global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'docker-exporter'
    metrics_path: /metrics.prom
    static_configs:
      - targets: ['docker-exporter:8090']

  - job_name: 'identity-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['identity-service:8083']

  - job_name: 'chat-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['chat-service:8081']

  - job_name: 'org-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['org-service:8082']

  - job_name: 'nginx-gateway'
    static_configs:
      - targets: ['nginx-exporter:9113']
