groups:
  - name: transcendence_alerts
    rules:
      - alert: MicroserviceDown
        expr: up{job=~"identity-service|chat-service|org-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Microservice {{ $labels.job }} is DOWN"
          description: "Microservice target {{ $labels.job }} at {{ $labels.instance }} has been down for > 30 seconds."

      - alert: ContainerDown
        expr: max_over_time(container_running[5m]) == 1 unless container_running == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} is DOWN"
          description: "Container {{ $labels.container }} was active recently but is no longer reporting as running."

      - alert: ContainerOOMKilled
        expr: container_oom_killed == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} OOM KILLED"
          description: "The Linux kernel has forcefully killed container {{ $labels.container }} due to out-of-memory constraints."

      - alert: HighContainerCpuUsage
        expr: container_cpu_usage_percentage > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.container }}"
          description: "Container {{ $labels.container }} CPU usage has exceeded 85% for more than 2 minutes."

      - alert: HighContainerMemoryUsage
        expr: (container_memory_usage_bytes / container_memory_limit_bytes) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on {{ $labels.container }}"
          description: "Container {{ $labels.container }} memory usage is above 85% of its limit for > 2 minutes."

      - alert: HighHttp5xxErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx Error Rate on {{ $labels.job }}"
          description: "Microservice {{ $labels.job }} is experiencing > 5% HTTP 5xx server errors over 5 minutes."

