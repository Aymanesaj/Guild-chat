storage:
  type: memory

ui:
  title: "ft_transcendence Status"
  header: "System Status"
  description: "Real-time health status of microservices, databases, and core infrastructure"

endpoints:
  - name: API Gateway
    group: Core Ingress
    url: "http://nginx:8080/nginx_status"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Frontend UI
    group: Core Ingress
    url: "http://frontend:80/"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Identity Service
    group: Microservices
    url: "http://identity-service:8083/actuator/health"
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

  - name: Organization Service
    group: Microservices
    url: "http://org-service:8082/actuator/health"
    interval: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

  - name: Chat Service
    group: Microservices
    url: "http://chat-service:8081/actuator/health"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

  - name: PostgreSQL Database
    group: Databases
    url: "tcp://postgres:5432"
    interval: 10s
    conditions:
      - "[CONNECTED] == true"

  - name: MongoDB Database
    group: Databases
    url: "tcp://mongodb:27017"
    interval: 10s
    conditions:
      - "[CONNECTED] == true"

  - name: Prometheus Metrics
    group: Observability
    url: "http://prometheus:9090/-/healthy"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

  - name: Grafana Dashboards
    group: Observability
    url: "http://grafana:3000/api/health"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

