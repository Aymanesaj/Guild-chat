pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream identity-service { server identity-service:8083; 
    }
    upstream chat-service     { server chat-service:8081; 
    }
    upstream docker-exporter  { server docker-exporter:8090; 
    }
    upstream grafana          { server grafana:3000; 
    }
    upstream prometheus       { server prometheus:9090; 
    }

    server {

        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.18.0.0/16;
            deny all;
        }

        location /api/users/ {
            rewrite ^/api/users/(.*)$ /$1 break;
            proxy_pass http://identity-service;
        }

        location /metrics.prom {
            proxy_pass http://docker-exporter/metrics.prom;
        }

        location /prometheus/ {
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass http://prometheus;
        }

        # location /api/orgs/  {
        #     rewrite ^/api/orgs/(.*)$ /$1 break; # for now
        #     proxy_pass http://org-service;
        # }

        # location /api/chat/  {
        #     rewrite ^/api/chat/(.*)$ /$1 break;
        #     proxy_pass http://chat-service;
        # }
        location /ws/chat {
            proxy_pass http://chat-service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;   # WS connections are long-lived, default proxy timeout will kill idle sockets
        }
        location /grafana/   {
            proxy_set_header Host $http_host;
            rewrite ^/grafana/(.*)$ /$1 break;
            proxy_pass http://grafana;
        }

        location = /api/rooms {
            proxy_pass http://chat-service;
        }

        location /api/rooms/ {
            proxy_pass http://chat-service;
        }

        location = /api/direct-messages {
            proxy_pass http://chat-service;
        }

        location /api/chat/  {
            rewrite ^/api/chat/(.*)$ /$1 break;
            proxy_pass http://chat-service;
        }

        location /           {
            try_files $uri $uri/ /index.html;
        }
    }
}