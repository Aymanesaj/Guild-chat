pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream identity-service { server identity-service:8083; }
    upstream org-service      { server org-service:8082; }
    upstream chat-service     { server chat-service:8081; }
    upstream frontend         { server frontend:8080; }
    upstream docker-exporter  { server docker-exporter:8090; }
    # upstream prometheus       { server prometheus:9090; }

    # "upgrade" for a WebSocket handshake, empty (= no Connection header)
    # otherwise, so plain HTTP requests aren't broken by a stray upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {

        listen 80;
        server_name localhost;

        # --- identity-service: auth, profile, avatars, friends --------------
        # The frontend calls /api/users/auth/login, /api/users/me,
        # /api/users/friends/list -- the prefix is stripped here, so the
        # service implements /auth/login, /me, /friends/list.
        location /api/users/ {
            rewrite ^/api/users/(.*)$ /$1 break;
            proxy_pass http://identity-service;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /metrics {
            proxy_pass http://docker-exporter/metrics;

        }

        # location /prometheus {
        #     rewrite ^/prometheus(.*)$ /$1 break;
        #     proxy_pass http://prometheus;

        # }

        # --- org-service: reserved, not called by the frontend yet ----------
        location /api/orgs/  {
            rewrite ^/api/orgs/(.*)$ /$1 break; # for now
            proxy_pass http://org-service;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- chat-service: rooms, members, invites, messages ----------------
        # The frontend calls /api/chat/rooms/... -> service sees /rooms/...
        location /api/chat/  {
            rewrite ^/api/chat/(.*)$ /$1 break;
            proxy_pass http://chat-service;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- chat-service: live message delivery ----------------------------
        # The frontend opens /ws/chat/rooms/{id} -> service sees /rooms/{id}.
        # The Upgrade/Connection pair plus HTTP/1.1 is what makes the
        # handshake actually upgrade; without them the socket just 400s.
        location /ws/chat/   {
            rewrite ^/ws/chat/(.*)$ /$1 break;
            proxy_pass http://chat-service;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Idle sockets must not be reaped after the default 60s.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # --- frontend SPA (must stay last: it is the catch-all) -------------
        location /           {
            proxy_pass http://frontend;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
