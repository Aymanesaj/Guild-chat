pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream identity-service { server identity-service:8083; }
    upstream org-service      { server org-service:8082; }
    upstream chat-service     { server chat-service:8081; }
    upstream frontend         { server frontend:8080; }

    server {
        listen 80;
        server_name localhost;

        location /api/users/ { proxy_pass http://identity-service; }
        location /api/orgs/  { proxy_pass http://org-service; }
        location /api/chat/  { proxy_pass http://chat-service; }
        location /ws/chat/   { proxy_pass http://chat-service; }
        location /           { proxy_pass http://frontend; }
    }
}