SecRequestBodyNoFilesLimit 10485760
SecResponseBodyAccess Off

SecRule REQUEST_URI "@beginsWith /ws/" \
    "id:10001,phase:1,pass,nolog,ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /grafana/" \
    "id:10002,phase:1,pass,nolog,ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /prometheus/" \
    "id:10003,phase:1,pass,nolog,ctl:ruleEngine=Off"
