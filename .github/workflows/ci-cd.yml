name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. FRONTEND: Lint & Build Validation
  # -------------------------------------------------------------
  frontend-lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-frontend/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: gateway-frontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  # -------------------------------------------------------------
  # 2. BACKEND: Spring Boot Microservices Tests
  # -------------------------------------------------------------
  backend-tests:
    name: Backend Tests (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Chat Service
            dir: application/chat-service
          - name: Org Service
            dir: application/org-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: ${{ matrix.service.dir }}
        run: ./mvnw test -q

  # -------------------------------------------------------------
  # 3. DOCKER: Compose Configuration Validation
  # -------------------------------------------------------------
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mock .env from example
        run: cp .env.example .env

      - name: Check Compose and monitoring
        run: bash monitoring/scripts/test-monitoring.sh

