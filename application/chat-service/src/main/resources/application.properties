spring.application.name=chat-service
server.port=${PORT:8081}

# Actuator: expose only health for now; /actuator/health is the compose healthcheck.
management.endpoints.web.exposure.include=health,info,prometheus

# MongoDB. Values come from environment variables (root .env via compose env_file).
# Secrets have no default on purpose: they must never live in this file.
# CHAT_MONGO_* names (not SPRING_DATA_MONGODB_*) so nothing in the shared .env can
# silently override another service's config.
spring.data.mongodb.host=${CHAT_MONGO_HOST:mongodb}
spring.data.mongodb.port=${CHAT_MONGO_PORT:27017}
spring.data.mongodb.database=${CHAT_MONGO_DB:chatdb}
spring.data.mongodb.username=${CHAT_MONGO_USER}
spring.data.mongodb.password=${CHAT_MONGO_PASSWORD}
# Database where the user was created (root users live in "admin").
spring.data.mongodb.authentication-database=${CHAT_MONGO_AUTH_DB:admin}


# JSON uses snake_case (spec §4): room_id, created_at, content_type
spring.jackson.property-naming-strategy=SNAKE_CASE


# gRPC clients. Hosts are Docker service names; ports are internal (not published).

chat.grpc.identity.host=${IDENTITY_GRPC_HOST:identity-service}
chat.grpc.identity.port=${IDENTITY_GRPC_PORT:9090}

chat.grpc.org.host=${ORG_GRPC_HOST:org-service}
chat.grpc.org.port=${ORG_GRPC_PORT:9090}


chat.grpc.deadline-ms=${CHAT_GRPC_DEADLINE_MS:500}

# RabbitMQ. Hosts are Docker service names; ports are internal (not published).
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
# Fail fast when the broker is down instead of the 60 s client default.
spring.rabbitmq.connection-timeout=2s

# AUTO acks after success or confirmed recovery to the durable DLQ.
# Recovery failure is rejected, never immediately requeued.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Broker outages must not mark chat unhealthy (nginx depends on it). Monitor RabbitMQ separately.
management.health.rabbit.enabled=false
