syntax = "proto3";

package chat;

option java_multiple_files = true;
option java_package = "com.fttranscendence.chat.grpc";
option java_outer_classname = "ChatProto";

// Served by chat-service, called by org-service. The same file lives in both
// services; keep the copies identical.
//
// org owns rooms and memberships but has no connection to the browser. When a
// room changes, org tells chat who is affected, and chat pushes a frame down
// those users' /ws/chat sockets so their room lists update without a refresh.
service ChatNotifyService {
  rpc RoomChanged(RoomChangedRequest) returns (RoomChangedResponse);
}

enum RoomChange {
  ROOM_CHANGE_UNSPECIFIED = 0; // proto3 default; rejected as INVALID_ARGUMENT
  ROOM_ADDED = 1;              // the users can now see the room (created, added, new DM)
  ROOM_REMOVED = 2;            // the users can no longer see it (left, kicked, room deleted)
  ROOM_UPDATED = 3;            // still visible, but its name, members or roles changed
}

message RoomChangedRequest {
  string room_id = 1;            // a number, as a string like every id in org.proto
  RoomChange change = 2;
  repeated string user_ids = 3;  // who to tell; users with no open socket are skipped
}

message RoomChangedResponse {
}
