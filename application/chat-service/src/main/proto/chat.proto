
syntax = "proto3";

package chat;

option java_multiple_files = true;
option java_package = "com.fttranscendence.chat.grpc";
option java_outer_classname = "ChatProto";

service ChatNotifyService {
  // Notify connected users about room changes.
  rpc RoomChanged(RoomChangedRequest) returns (RoomChangedResponse);

  // Delete all chat data associated with a deleted room.
  rpc DeleteRoom(DeleteRoomRequest) returns (DeleteRoomResponse);
}

enum RoomChange {
  ROOM_CHANGE_UNSPECIFIED = 0;
  ROOM_ADDED = 1;
  ROOM_REMOVED = 2;
  ROOM_UPDATED = 3;
}

message RoomChangedRequest {
  string room_id = 1;
  RoomChange change = 2;
  repeated string user_ids = 3;
}

message RoomChangedResponse {
}

message DeleteRoomRequest {
  string room_id = 1;
}

message DeleteRoomResponse {
  // Number of messages deleted, if useful for logging.
  int64 deleted_messages = 1;
}
