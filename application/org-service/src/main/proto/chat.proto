
syntax = "proto3";

package chat;

option java_multiple_files = true;
option java_package = "com.fttranscendence.chat.grpc";
option java_outer_classname = "ChatProto";

service ChatNotifyService {
  // Notify connected users about room changes.
  rpc RoomChanged(RoomChangedRequest) returns (RoomChangedResponse);
}

enum RoomChange {
  ROOM_CHANGE_UNSPECIFIED = 0;
  ROOM_ADDED = 1;
  ROOM_REMOVED = 2;
  ROOM_UPDATED = 3;
}

message RoomChangedRequest {
  string room_id = 1;
  RoomChange change = 2;
  repeated string user_ids = 3;
}

message RoomChangedResponse {
}
