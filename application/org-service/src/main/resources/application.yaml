spring:
  application:
    name: org-service

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres_db:5432/${ORG_POSTGRES_DB:org_service_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${ORG_POSTGRES_USER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${ORG_POSTGRES_PASSWORD:admin}}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always