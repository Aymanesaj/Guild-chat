spring.application.name=identity-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://identity-service_postgres:5432/${IDENTITY_POSTGRES_DB:transdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${IDENTITY_POSTGRES_USER:admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${IDENTITY_POSTGRES_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

app.jwt.secret=${JWT_SECRET:OBYcCOxLMXYDJxwgeOAdASTDflOwKNVm}
app.jwt.issuer=${JWT_ISSUER:ft-transcendence}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}

grpc.server.port=${GRPC_SERVER_PORT:9090}
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
app.avatar.storage-dir=${AVATAR_STORAGE_DIR:/tmp/identity-avatars}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost}

app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.oauth.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost/api/users/oauth/github/callback}
