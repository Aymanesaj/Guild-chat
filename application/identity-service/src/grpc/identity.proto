syntax = "proto3";

package identity;

option java_multiple_files = true;
option java_package = "com.fttranscendence.identity.grpc";
option java_outer_classname = "IdentityProto";

service IdentityService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc AreFriends (AreFriendsRequest) returns (AreFriendsResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
  string email = 4;
  int64 expires_at = 5;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
}

message AreFriendsRequest {
  string user_a = 1;
  string user_b = 2;
}

message AreFriendsResponse {
  bool are_friends = 1;
}
