services:

# -----------------------------------------------------------
# ---------------------- Reverse proxy ----------------------
# -----------------------------------------------------------

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - 8000:80
    networks:
      - private
    depends_on:
      - chat-service
      - identity-service
      - org-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always


# -----------------------------------------------------------
# --------------------- Micro services ----------------------
# -----------------------------------------------------------
  chat-service:
    build:
      context: ./services/
      dockerfile: ./chat-service/Dockerfile
    container_name: chat-service
    environment:
      PORT: 8081
    networks:
      - private
    expose:
      - "8081"
    restart: always

  identity-service:
    build: services/identity-service/.
    container_name: identity-service
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: ${JWT_SECRET:-OBYcCOxLMXYDJxwgeOAdASTDflOwKNVm}}
      JWT_ISSUER: ft-transcendence
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/users/oauth/github/callback}
    volumes:
      - identity_avatars:/tmp/identity-avatars
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8083"
    restart: always

  org-service:
    build:
      context: ./services/
      dockerfile: ./org-service/Dockerfile
    container_name: org-service
    environment:
      PORT: 8082
    networks:
      - private
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always


# -----------------------------------------------------------
# --------------------- Data exporters ----------------------
# -----------------------------------------------------------

  docker-exporter:
    container_name: docker-exporter
    # build: ./infra/exporter/
    image: ghcr.io/seraph919/docker-exporter:v2.4
    expose:
    - "8090"
    volumes:
    - /var/run/user/${UID}/docker.sock:/var/run/docker.sock:ro
    networks:
    - private
    env_file:
    - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://docker-exporter:8090"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
  

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /goinfre/${USER}/docker/containers:/goinfre/${USER}/docker/containers:ro
      - /var/run/user/${UID}/docker.sock:/var/run/user/${UID}/docker.sock:ro
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    entrypoint: >
      /bin/sh -c "
      apt-get update && apt-get install -y gettext-base &&
      envsubst < /etc/promtail/config.yml > /tmp/config.yml &&
      exec /usr/bin/promtail -config.file=/tmp/config.yml
      "
    #uses port 8093 internally with promitheus
    env_file:
      - ./.env
    networks:
    - private
    depends_on:
      - loki
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"
    networks:
      - private
    restart: always

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=http://localhost/prometheus/'
      - '--web.route-prefix=/'
    volumes: 
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - private
    restart: always


  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:latest
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    expose:
      - "9093"
    networks:
      - private
    restart: always
    

# -----------------------------------------------------------
# -------------------- Data visualization -------------------
# -----------------------------------------------------------

  grafana:
    build: ./infra/grafana/
    container_name: grafana
    expose:
    - "3000"
    networks:
    - private
    user : "root"
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/grafana/:/etc/grafana/provisioning:ro
    - database:/var/lib/postgresql/data
    env_file:
      - ./.env
    restart: always


# -----------------------------------------------------------
# ------------------------ Data Base ------------------------
# -----------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - ./.env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transdb"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: always
    networks:
      - private
  
  # # vault:
  # #   image: hashicorp/vault:latest

volumes:
  database:
    name: "database"
  prometheus_data:
    name: "prometheus_data"
  grafana_data:
    name: "grafana_data"
  identity_avatars:
    name: "identity_avatars"

networks:
  private:
    name: private