services:
  nginx:
    container_name: nginx
    build: gateway/.
    ports:
      - 8000:80
    networks:
      - private
    depends_on:
      - chat-service
      - identity-service
      - org-service
      - frontend
    restart: always

  chat-service:
    image: python:alpine
    container_name: chat-service
    command: >
      python3 -m http.server 8081 --directory /tmp --bind 0.0.0.0
    networks:
      - private
    volumes:
      - ./services/chat-service/index.html:/tmp/index.html
    # depends_on:
      # - postgres
    expose:
      - "8081"
    restart: always
  identity-service:
    image: python:alpine
    command: >
      python3 -m http.server 8083 --directory /tmp --bind 0.0.0.0
    container_name: identity-service
    networks:
      - private
    volumes:
      - ./services/identity-service/index.html:/tmp/index.html
    # depends_on:
      # - postgres
    expose:
      - "8083"
    restart: always
  org-service:
    image: python:alpine
    command: >
      python3 -m http.server 8082 --directory /tmp --bind 0.0.0.0
    container_name: org-service
    networks:
      - private
    volumes:
      - ./services/org-service/index.html:/tmp/index.html
    # depends_on:
      # - postgres
    expose:
      - "8082"
    restart: always
  frontend:
    image: python:alpine
    command: >
      python3 -m http.server 8080 --directory /tmp --bind 0.0.0.0
    container_name: frontend
    networks:
      - private
    volumes:
      - ./frontend/index.html:/tmp/index.html
    expose:
      - "8080"
    restart: always
  

  docker-exporter:
    container_name: docker-exporter
    image: seraph919/docker-socket-metrics-exporter
    expose:
    - "8090"
    volumes:
    - /var/run/user/${UID}/docker.sock:/var/run/docker.sock:ro
    networks:
    - private
    restart: always

