services:

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      - PARANOIA=1
      - BLOCKING_PARANOIA=1
      - MODSEC_RULE_ENGINE=on
      - ALLOWED_METHODS=GET HEAD POST OPTIONS PUT PATCH DELETE
    ports:
      - 80:8080
      - 443:8443
      - 8000:8080
      - 8443:8443
    volumes:
      - ./certs:/certs:ro
    networks:
      - private
    depends_on:
      frontend:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      org-service:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_started
      docker-exporter:
        condition: service_healthy
      status-page:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - private
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    restart: always

  org-service:
    build: services/org-service/.
    container_name: org-service
    environment:
      SPRING_DATASOURCE_URL: ${ORG_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${ORG_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORG_DATASOURCE_PASSWORD}
      PORT: 8082
    env_file:
      - ./.env
    networks:
      - private
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always


  chat-service:
    build:
      context: ./services/
      dockerfile: ./chat-service/Dockerfile
    container_name: chat-service
    environment:
      PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - private
    env_file:
      - ./.env
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "8081"
    restart: always

  mongodb:
    image: mongo:7
    container_name: mongodb
    env_file:
      - ./.env
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    networks:
      - private
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  identity-service:
    build: services/identity-service/.
    container_name: identity-service
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health/readiness"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 15s
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always


  docker-exporter:
    container_name: docker-exporter
    build: ./infra/docker-exporter/
    expose:
    - "8090"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
    - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://docker-exporter:8090/metrics.prom"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx:8080/nginx_status
    networks:
      - private
    depends_on:
      - nginx
    restart: always

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=http://localhost/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - private
    restart: always

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:latest
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    expose:
      - "9093"
    networks:
      - private
    restart: always

  grafana:
    build: ./infra/grafana/
    container_name: grafana
    expose:
      - "3000"
    networks:
      - private
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./.env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: always
    networks:
      - private

  status-page:
    image: twinproduction/gatus:latest
    container_name: status-page
    env_file:
      - ./.env
    volumes:
      - ./infra/status/config.yaml:/config/config.yaml:ro
    expose:
      - "8080"
    networks:
      - private
    restart: always

  backup-service:
    build: ./infra/backup
    container_name: backup-service
    volumes:
      - ./backups:/backups
    env_file:
      - ./.env
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  database:
    name: "database"
  prometheus_data:
    name: "prometheus_data"
  grafana_data:
    name: "grafana_data"
  identity_avatars:
    name: "identity_avatars"
  mongo_data:
    name: "mongo_data"

networks:
  private:
    name: private
