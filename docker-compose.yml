services:
  nginx:
    container_name: nginx
    build: gateway/.
    ports:
      - 8000:80
    networks:
      - private
    depends_on:
      - chat-service
      - identity-service
      - org-service
      - frontend
    restart: always

  chat-service:
    image: python:alpine
    container_name: chat-service
    command: >
      python3 -m http.server 8081 --directory /tmp --bind 0.0.0.0
    networks:
      - private
    volumes:
      - ./services/chat-service/index.html:/tmp/index.html
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"
    restart: always

  identity-service:
    build: services/identity-service/.
    container_name: identity-service
    networks:
      - private
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: OBYcCOxLMXYDJxwgeOAdASTDflOwKNVm
      JWT_ISSUER: ft-transcendence
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/users/oauth/github/callback}
    volumes:
      - identity_avatars:/tmp/identity-avatars
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8083"
    restart: always

  org-service:
    image: python:alpine
    command: >
      python3 -m http.server 8082 --directory /tmp --bind 0.0.0.0
    container_name: org-service
    networks:
      - private
    volumes:
      - ./services/org-service/index.html:/tmp/index.html
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8082"
    restart: always

  frontend:
    image: python:alpine
    command: >
      python3 -m http.server 8080 --directory /tmp --bind 0.0.0.0
    container_name: frontend
    networks:
      - private
    volumes:
      - ./frontend/index.html:/tmp/index.html
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
  

  docker-exporter:
    container_name: docker-exporter
    image: ghcr.io/seraph919/docker-exporter:v2.1
    expose:
    - "8090"
    volumes:
    - /var/run/user/${UID}/docker.sock:/var/run/docker.sock:ro
    networks:
    - private
    restart: always

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
    - "3000:3000"
    networks:
    - private
    user : "root"
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/grafana/:/etc/grafana/provisioning:ro
    - database:/var/lib/postgresql/data
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    - DS_PROMETHEUS=prometheus
    restart: always

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes: 
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - private
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: transdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
  
  # vault:
  #   image: hashicorp/vault:latest

volumes:
  database:
    name: "database"
  prometheus_data:
    name: "prometheus_data"
  grafana_data:
    name: "grafana_data"
  identity_avatars:
    name: "identity_avatars"

networks:
  private:
    name: private