spring.application.name=chat-service
server.port=8081

# Local/dev defaults. In docker-compose these are overridden by the
# SPRING_DATASOURCE_* env vars set on the chat-service container.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chat_password}

# Schema is owned by Flyway (CLAUDE.md §5), never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
