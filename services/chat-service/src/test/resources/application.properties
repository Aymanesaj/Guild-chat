spring.application.name=chat-service
app.jwt.secret=test-only-secret-key-not-used-in-production-min-32-bytes

# Index creation is an eager operation: Spring Data connects to MongoDB while
# the context is still starting in order to issue createIndex. That is exactly
# what we want in production and exactly what we cannot do in a unit test run,
# which has no database.
#
# The cost of switching it off here is real and worth stating: this test proves
# the beans wire together, it does NOT prove the indexes get created. That has
# to be verified against a running stack (see notes/03-testing.md).
spring.data.mongodb.auto-index-creation=false
