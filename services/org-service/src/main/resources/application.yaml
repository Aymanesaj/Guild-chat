spring:
  application:
    name: org-service

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/org_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ft-transcendence}

server:
  port: ${PORT:8082}