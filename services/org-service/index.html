<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>org-service</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Space+Mono:wght@400;700&family=Tektur:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #F0A6CA;
      --neon-cyan: #5EDCF4;
      --neon-yellow: #F4D03F;
      --deep-navy: #0F1B3D;
      --dark-void: #0A0E27;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Chakra Petch', sans-serif;
      background: var(--dark-void);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Atmospheric Effects */
    .scanlines::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(10, 14, 39, 0.04) 2px, rgba(10, 14, 39, 0.04) 4px);
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: multiply;
    }

    .bg-grid {
      background-color: var(--dark-void);
      background-image: linear-gradient(rgba(94, 220, 244, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(94, 220, 244, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .pixel-hero-text {
      font-family: 'Tektur', cursive;
      font-weight: 900;
      font-size: clamp(3rem, 10vw, 8rem);
      color: var(--neon-cyan);
      text-shadow: 4px 4px 0 var(--neon-yellow), 8px 8px 0 var(--deep-navy);
      text-align: center;
      line-height: 1.05;
    }

    .hero-subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--neon-pink);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero-tagline {
      color: rgba(255,255,255,0.7);
      max-width: 500px;
      text-align: center;
      margin-top: 2rem;
    }
  </style>
</head>
<body class="bg-grid scanlines">

  <section class="slide">
    <div class="hero-subtitle">Ta7yati</div>
    <h1 class="pixel-hero-text">Org-service<br>Test</h1>
    <p class="hero-tagline">Wasil</p>
  </section>

</body>
</html>
