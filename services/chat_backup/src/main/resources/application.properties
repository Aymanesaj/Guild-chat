spring.application.name=chat-service
server.port=${PORT:8081}

spring.data.mongodb.uri=${MONGO_URI:mongodb://mongodb:27017/chatdb}
app.jwt.secret=${JWT_SECRET}

# Spring Data MongoDB stopped creating indexes from @Indexed/@CompoundIndex
# automatically in 3.0. Without this line those annotations are inert and every
# query is a full collection scan. See notes/04-findings-and-roadmap.md #1.
spring.data.mongodb.auto-index-creation=true

# --- Chat limits -------------------------------------------------------------
# Max characters in one message. 2000 matches Discord; Slack allows ~4000.
# Worst case 4 bytes/char UTF-8 => ~8 KB per message document.
app.chat.max-message-length=2000
# Token bucket per user: burst of 10, refilled at 5 messages/second.
app.chat.rate-limit.capacity=10
app.chat.rate-limit.refill-per-second=5

# --- Monitoring --------------------------------------------------------------
# Actuator exposes ONLY health over HTTP by default. Prometheus needs the
# /actuator/prometheus endpoint, so it must be named explicitly here.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Tags every metric with the service name so Grafana can filter by service.
management.metrics.tags.application=${spring.application.name}
