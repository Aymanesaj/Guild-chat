spring.application.name=identity-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/transdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

app.jwt.secret=${JWT_SECRET:OBYcCOxLMXYDJxwgeOAdASTDflOwKNVm}
app.jwt.issuer=${JWT_ISSUER:ft-transcendence}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
app.avatar.storage-dir=${AVATAR_STORAGE_DIR:/tmp/identity-avatars}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8000}

app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.oauth.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8000/api/users/oauth/github/callback}
