spring.datasource.url=jdbc:h2:mem:identity-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-with-more-than-thirty-two-characters
app.jwt.issuer=identity-service-test
app.jwt.ttl-seconds=3600
app.avatar.storage-dir=${java.io.tmpdir}/identity-test-avatars
app.oauth.github.client-id=
app.oauth.github.client-secret=
app.oauth.github.redirect-uri=http://localhost:8000/api/users/oauth/github/callback
